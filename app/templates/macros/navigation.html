{% macro render_nav() %}
<style>
    .instagram-nav {
        background: white;
        border-bottom: 1px solid #dbdbdb;
        padding: 10px 0;
        position: sticky;
        top: 0;
        z-index: 100;
    }
    .nav-container {
        max-width: 935px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px;
    }
    .nav-logo {
        font-family: 'Brush Script MT', cursive;
        font-size: 28px;
        font-weight: bold;
    }
    .nav-links a {
        margin-left: 20px;
        text-decoration: none;
        color: #262626;
        font-weight: 600;
        position: relative;
    }
    .notif-badge {
        position: absolute;
        top: -8px;
        right: -8px;
        background: #ff3040;
        color: white;
        border-radius: 50%;
        width: 18px;
        height: 18px;
        font-size: 11px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .nav-icon {
        vertical-align: middle;
        display: inline-flex;
        align-items: center;
    }
    .nav-icon svg {
        width: 24px;
        height: 24px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
    }
</style>

<nav class="instagram-nav">
    <div class="nav-container">
        <h2 class="nav-logo">Instagram</h2>
        <div class="nav-links">
            <a href="{{ url_for('main.search') }}" title="Search">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7.5"/><line x1="16" y1="16" x2="21" y2="21"/></svg>
                </span>
            </a>
            <a href="{{ url_for('main.feed') }}">Feed</a>
            <a href="{{ url_for('main.explore') }}">Explore</a>
            <a href="{{ url_for('main.notifications') }}" title="Notifications" id="notif-link">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/></svg>
                </span>
                <span class="notif-badge" id="notif-badge" style="display: none;">0</span>
            </a>
            <a href="{{ url_for('main.messages') }}" title="Messages">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10h8c1.1 0 2-.9 2-2v-8c0-5.52-4.48-10-10-10zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8v8h-8z"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/></svg>
                </span>
            </a>
            <a href="{{ url_for('main.profile') }}">Profile</a>
        </div>
    </div>
</nav>

<script>
    // Load notification count on page load
    function loadNotificationCount() {
        fetch('/notifications/count')
            .then(response => response.json())
            .then(data => {
                if (data.count > 0) {
                    const badge = document.getElementById('notif-badge');
                    if (badge) {
                        badge.textContent = data.count;
                        badge.style.display = 'flex';
                    }
                }
            })
            .catch(error => console.error('Error loading notifications:', error));
    }

    // Load notification count when page loads
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadNotificationCount);
    } else {
        loadNotificationCount();
    }
</script>
{% endmacro %}
